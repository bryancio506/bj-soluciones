<!doctype html>
<!--
  ANUNCIO 06 — "Antes / Después" con corte vertical
  ===========================================================================
  Formato : 1080 x 1080 (1:1)  →  feed de Facebook e Instagram
  Servicio: Remodelación de baños
  Idea    : la misma comparación del anuncio 02 pero partida en vertical. Es la
            que mejor funciona cuando las dos fotos son verticales (interiores,
            baños, escaleras).

  QUÉ SE PUEDE CAMBIAR
  --------------------
  · Las dos fotos → `src` de .lado-izq (antes) y .lado-der (después). Que sean
    verticales: si usás horizontales se recortan mucho a los lados.
  · Dónde cae el corte → los porcentajes de .lado-izq / .lado-der. Si querés
    darle más espacio al "después", subí los dos porcentajes (ej. 46% y 34%) y
    corregí el `left` de .linea-corte para que la línea siga coincidiendo.

  EXPORTAR: desde anuncios/ correr  ./exportar.sh 06-bano-antes-despues
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>BJ Soluciones — Anuncio 06 · Antes/Después baño (1080×1080)</title>
  <link rel="stylesheet" href="../_marca/marca.css">
  <style>
    :root { --w: 1080px; --h: 1080px; }   /* formato 1:1 */

    /* Corte vertical inclinado: arriba en 56%, abajo en 44%. */
    .lado { position: absolute; inset: 0; }
    .lado-izq { clip-path: polygon(0 0, 56% 0, 44% 100%, 0 100%); z-index: 0; }
    .lado-der { clip-path: polygon(56% 0, 100% 0, 100% 100%, 44% 100%); z-index: 1; }

    .foto-antes { filter: grayscale(.45) brightness(.7) contrast(1.05); }

    .linea-corte {
      left: 534px; top: -80px; width: 12px; height: 1240px;
      transform: rotate(6.84deg);
    }

    /* Van debajo del logo para no chocar con él. */
    .etq-antes   { top: 168px; left: 46px; }
    .etq-despues { top: 168px; right: 46px; }

    .logo-arriba {
      position: absolute; top: 46px; left: 50%; transform: translateX(-50%); z-index: 4;
    }

    .bloque-pie {
      position: absolute; left: 56px; right: 56px; bottom: 52px; z-index: 4;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 30px;
    }
    .bloque-pie .texto-pie { flex: 1; min-width: 0; }
    .bloque-pie .titular { font-size: 58px; margin: 14px 0 12px; }
    .bloque-pie .bajada  { font-size: 24px; }
  </style>
</head>
<body data-ancho="1080" data-alto="1080">

<div class="lienzo">

  <!-- ---------- ANTES (izquierda) ---------- -->
  <div class="lado lado-izq">
    <img class="foto foto-antes" style="object-position: 55% center"
         src="../../public/proyectos/remodelacion-04-antes.jpeg"
         alt="Baño antes de la remodelación">
  </div>

  <!-- ---------- DESPUÉS (derecha) ---------- -->
  <div class="lado lado-der">
    <img class="foto" style="object-position: 45% center"
         src="../../public/proyectos/remodelacion-04-despues.jpeg"
         alt="Baño remodelado con mueble nuevo y tope en cuarzo">
  </div>

  <div class="filo-rojo linea-corte" style="z-index:3"></div>
  <div class="velo-abajo" style="z-index:2"></div>

  <!-- ---------- ETIQUETAS ---------- -->
  <div class="etiqueta etq-antes">Antes</div>
  <div class="etiqueta despues etq-despues">Después</div>

  <!-- ---------- LOGO ---------- -->
  <div class="logo-arriba">
    <div class="marca chica">
      <img src="../../public/logo.png" alt="Logo BJ Soluciones">
      <div>
        <div class="nombre">BJ Soluciones</div>
        <div class="slogan">Remodelación · Acabados</div>
      </div>
    </div>
  </div>

  <!-- ---------- TEXTO + LLAMADO A LA ACCIÓN ---------- -->
  <div class="bloque-pie">
    <div class="texto-pie">
      <div class="antetitulo clara">Remodelación de baños</div>
      <h1 class="titular">Su baño puede<br>verse <span class="resalte">así</span></h1>
      <p class="bajada">Mueble a la medida y tope en cuarzo.<br>En pocos días y sin dejarle desorden.</p>
    </div>

    <div class="wa chica">
      <span class="icono">
        <svg viewBox="0 0 24 24"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.42-.08-.12-.28-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.89 9.89-9.89 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.89-9.88 9.89m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.41"/></svg>
      </span>
      <span class="texto">
        <span class="arriba">Cotice gratis</span>
        <span class="numero">6004-0817</span>
      </span>
    </div>
  </div>

</div>
</body>
</html>
