<!doctype html>
<!--
  ANUNCIO 04 — Historia / Reel: "Soldadura y estructuras metálicas"
  ===========================================================================
  Formato : 1080 x 1920 (9:16)  →  Historias de Instagram y Facebook, portada
            de Reel, o estado de WhatsApp.
  Servicio: Soldadura
  Estructura: collage de 4 fotos arriba + panel claro con corte diagonal abajo.

  ZONA SEGURA (importante en historias)
  -------------------------------------
  Instagram y Facebook tapan más o menos los primeros 250 px de arriba (nombre
  del perfil) y los últimos 340 px de abajo (botón "Enviar mensaje" / barra de
  responder). Por eso el titular arranca bien abajo del borde superior y el
  botón de WhatsApp queda por encima de los últimos 340 px.
  Para verificarlo: agregá la clase `ver-guias` al <body> y recargá — aparece un
  rectángulo punteado rojo con el área segura. Quitala antes de exportar.

  QUÉ SE PUEDE CAMBIAR
  --------------------
  · Las 4 fotos → los `src` dentro de .collage. La celda grande (c1) es vertical,
    las dos de la derecha son cuadradas y la de abajo es horizontal: elegí fotos
    con esa orientación y no hay que reencuadrar nada.
  · La separación roja entre fotos → `gap` de .collage.
  · Si movés el panel claro (`top` de .panel`), movés también la línea roja
    (.linea-corte) la misma cantidad, o dejan de coincidir.

  EXPORTAR: desde anuncios/ correr  ./exportar.sh 04-story-soldadura
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>BJ Soluciones — Anuncio 04 · Historia soldadura (1080×1920)</title>
  <link rel="stylesheet" href="../_marca/marca.css">
  <style>
    :root { --w: 1080px; --h: 1920px; }   /* formato 9:16 */

    /* ---- Collage de fotos ---- */
    .collage {
      position: absolute; top: 0; left: 0; width: 1080px; height: 1016px; z-index: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 310px 310px 380px;
      gap: 8px;
      background: var(--rojo);   /* se ve en las separaciones */
    }
    .collage .celda { overflow: hidden; }
    .collage .c1 { grid-row: 1 / 3; }      /* vertical grande, izquierda */
    .collage .c4 { grid-column: 1 / 3; }   /* horizontal ancha, abajo */

    /* ---- Panel claro con corte diagonal ---- */
    .panel {
      position: absolute; left: 0; right: 0; top: 940px; bottom: 0; z-index: 2;
      background: var(--crema);
      color: var(--negro);
      clip-path: polygon(0 70px, 100% 0, 100% 100%, 0 100%);
    }
    .linea-corte {
      left: -50px; top: 969px; width: 1180px; height: 12px;
      transform: rotate(-3.71deg); z-index: 3;
    }

    .contenido {
      position: absolute; left: 70px; right: 70px; top: 128px;
    }
    .contenido .titular { font-size: 70px; margin: 26px 0 34px; }
    .contenido .lista-check li { font-size: 30px; }
    .contenido .wa { margin-top: 42px; }

    /* ---- Pie negro ---- */
    .pie-historia {
      position: absolute; left: 0; right: 0; bottom: 0; height: 190px; z-index: 4;
      background: var(--negro); color: #fff;
      display: flex; align-items: center; justify-content: space-between; gap: 40px;
      padding: 0 56px;
    }
    .pie-historia .marca { flex: none; }
    .pie-historia .sitio {
      font-family: var(--head); font-weight: 800; font-size: 24px; letter-spacing: -.02em;
      white-space: nowrap; flex: none;
    }
  </style>
</head>
<body data-ancho="1080" data-alto="1920">

<div class="lienzo">

  <!-- ---------- COLLAGE ---------- -->
  <div class="collage">
    <div class="celda c1">
      <img class="foto" style="object-position: center 45%"
           src="../../public/proyectos/soldadura-03-durante.jpeg"
           alt="Soldador armando la estructura de acero">
    </div>
    <div class="celda c2">
      <img class="foto" src="../../public/proyectos/soldadura-porton00-durante.jpeg"
           alt="Portón corredizo en aluminio">
    </div>
    <div class="celda c3">
      <img class="foto" src="../../public/proyectos/soldadura-05-despues.jpeg"
           alt="Techo metálico a la medida">
    </div>
    <div class="celda c4">
      <img class="foto" style="object-position: center 22%"
           src="../../public/proyectos/soldadura-escalera-01-despues.jpeg"
           alt="Escalera con estructura metálica y baranda de vidrio">
    </div>
  </div>

  <!-- ---------- PANEL DE TEXTO ---------- -->
  <div class="panel">
    <div class="contenido">
      <div class="antetitulo">Trabajo fino · Toda la GAM</div>

      <h1 class="titular">Soldadura y<br>estructuras<br><span class="resalte">metálicas</span></h1>

      <ul class="lista-check">
        <li>
          <span class="check"><svg viewBox="0 0 24 24"><path d="M4 12.6l5.2 5.2L20 6.6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          Escaleras, barandas y pasamanos
        </li>
        <li>
          <span class="check"><svg viewBox="0 0 24 24"><path d="M4 12.6l5.2 5.2L20 6.6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          Portones, verjas y rejas
        </li>
        <li>
          <span class="check"><svg viewBox="0 0 24 24"><path d="M4 12.6l5.2 5.2L20 6.6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          Techos y entrepisos de acero
        </li>
        <li>
          <span class="check"><svg viewBox="0 0 24 24"><path d="M4 12.6l5.2 5.2L20 6.6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          Estructura para segunda planta
        </li>
      </ul>

      <div class="wa">
        <span class="icono">
          <svg viewBox="0 0 24 24"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.42-.08-.12-.28-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.89 9.89-9.89 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.89-9.88 9.89m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.41"/></svg>
        </span>
        <span class="texto">
          <span class="arriba">Cotice hoy sin compromiso</span>
          <span class="numero">6004-0817</span>
        </span>
      </div>
    </div>
  </div>

  <div class="filo-rojo linea-corte"></div>

  <!-- ---------- PIE ---------- -->
  <div class="pie-historia">
    <div class="marca chica">
      <img src="../../public/logo.png" alt="Logo BJ Soluciones">
      <div>
        <div class="nombre">BJ Soluciones</div>
        <div class="slogan">Construcción · Remodelación</div>
      </div>
    </div>
    <div class="sitio">bj-soluciones.netlify.app</div>
  </div>

  <!-- guía de zona segura (solo se ve con class="ver-guias" en el body) -->
  <div class="zona-segura"></div>

</div>
</body>
</html>
