<!doctype html>
<!--
  ANUNCIO 02 — "Antes / Después" con corte diagonal
  ===========================================================================
  Formato : 1080 x 1080 (1:1)  →  feed de Facebook e Instagram
  Servicio: Remodelación de oficinas / locales comerciales
  Idea    : la mitad de arriba es el ANTES (apagado a propósito) y la de abajo
            el DESPUÉS (a todo color). El corte en diagonal repite la cuña roja
            del logo.

  OJO CON LA FOTO DEL "DESPUÉS": de esa foto solo se ve la franja de abajo, y
  encima va el texto. Elegí una donde lo bonito quede en la parte alta de la
  imagen, no en el piso — si no, el texto lo tapa.

  QUÉ SE PUEDE CAMBIAR
  --------------------
  · Las dos fotos → `src` de las <img> marcadas ANTES y DESPUÉS. Funciona mejor
    con fotos horizontales tomadas desde el mismo punto.
  · Qué tan apagado se ve el ANTES → el `filter` de .foto-antes en el <style>.
  · La inclinación del corte → los porcentajes de .mitad-arriba / .mitad-abajo
    y el `rotate` de la línea roja. Si cambiás uno, cambiá los tres o la línea
    deja de coincidir con el corte.

  EXPORTAR: desde anuncios/ correr  ./exportar.sh 02-antes-despues-terraza
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>BJ Soluciones — Anuncio 02 · Antes/Después terraza (1080×1080)</title>
  <link rel="stylesheet" href="../_marca/marca.css">
  <style>
    :root { --w: 1080px; --h: 1080px; }   /* formato 1:1 */

    /* El corte diagonal: arriba baja de 44% a 56%, abajo es el complemento. */
    .mitad { position: absolute; inset: 0; }
    .mitad-arriba { clip-path: polygon(0 0, 100% 0, 100% 44%, 0 56%); z-index: 0; }
    .mitad-abajo  { clip-path: polygon(0 56%, 100% 44%, 100% 100%, 0 100%); z-index: 1; }

    /* Cada foto se acomoda dentro de SU franja (no del lienzo entero). Así
       `object-position` sirve para reencuadrar lo que de verdad se ve. */
    .mitad-arriba .foto { position: absolute; top: 0;    left: 0; right: 0; height: 620px; }
    .mitad-abajo  .foto { position: absolute; bottom: 0; left: 0; right: 0; height: 650px; }

    /* El "antes" va desaturado y más oscuro, el "después" un poco más brillante:
       ese contraste entre las dos mitades es lo que hace que se lea de un golpe. */
    .foto-antes  { filter: grayscale(.7) brightness(.62) contrast(1.05); }
    .foto-despues{ filter: brightness(1.18) saturate(1.05); }

    /* Línea roja pegada al corte (misma pendiente: -6.84°). */
    .linea-corte {
      left: -80px; top: 534px; width: 1240px; height: 12px;
      transform: rotate(-6.84deg);
    }

    .logo-esq { position: absolute; top: 44px; right: 48px; z-index: 4; }

    .etq-antes   { top: 48px;  left: 48px; }
    .etq-despues { top: 632px; left: 48px; }

    .bloque-pie {
      position: absolute; left: 56px; right: 56px; bottom: 52px; z-index: 4;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 30px;
    }
    .bloque-pie .texto-pie { flex: 1; min-width: 0; }
    .bloque-pie .titular { font-size: 56px; margin: 14px 0 12px; }
    .bloque-pie .bajada  { font-size: 24px; }
  </style>
</head>
<body data-ancho="1080" data-alto="1080">

<div class="lienzo">

  <!-- ---------- ANTES (mitad de arriba) ---------- -->
  <div class="mitad mitad-arriba">
    <img class="foto foto-antes" style="object-position: center 45%"
         src="../../public/proyectos/remodelacion-01-antes.jpeg"
         alt="Oficina vacía antes de la remodelación">
  </div>

  <!-- ---------- DESPUÉS (mitad de abajo) ---------- -->
  <div class="mitad mitad-abajo">
    <img class="foto foto-despues" style="object-position: center 40%"
         src="../../public/proyectos/remodelacion-01-despues.jpeg"
         alt="Oficina remodelada y entregada limpia">
  </div>

  <div class="filo-rojo linea-corte"></div>
  <div class="velo-abajo" style="z-index:2"></div>

  <!-- ---------- ETIQUETAS ---------- -->
  <div class="etiqueta etq-antes">Antes</div>
  <div class="etiqueta despues etq-despues">Después</div>

  <!-- ---------- LOGO ---------- -->
  <div class="logo-esq">
    <div class="marca chica derecha">
      <img src="../../public/logo.png" alt="Logo BJ Soluciones">
      <div>
        <div class="nombre">BJ Soluciones</div>
        <div class="slogan">Construcción · Remodelación</div>
      </div>
    </div>
  </div>

  <!-- ---------- TEXTO + LLAMADO A LA ACCIÓN ---------- -->
  <div class="bloque-pie">
    <div class="texto-pie">
      <div class="antetitulo clara">Oficinas y locales</div>
      <h1 class="titular">Así cambia<br>un espacio</h1>
      <p class="bajada">Pisos, pintura y limpieza final.<br>Se lo entregamos listo para trabajar.</p>
    </div>

    <div class="wa chica">
      <span class="icono">
        <svg viewBox="0 0 24 24"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.42-.08-.12-.28-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.89 9.89-9.89 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.89-9.88 9.89m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.41"/></svg>
      </span>
      <span class="texto">
        <span class="arriba">Cotice gratis</span>
        <span class="numero">6004-0817</span>
      </span>
    </div>
  </div>

</div>
</body>
</html>
