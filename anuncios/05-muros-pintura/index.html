<!doctype html>
<!--
  ANUNCIO 05 — "Antes / Durante / Después" en tres bandas
  ===========================================================================
  Formato : 1080 x 1350 (4:5)  →  feed de Facebook e Instagram
  Servicio: Pintura / reparación de muros exteriores
  Idea    : mostrar el proceso completo en una sola imagen. Es el formato que
            más se comparte porque se entiende sin leer nada.

  QUÉ SE PUEDE CAMBIAR
  --------------------
  · Las tres fotos → los `src` de cada .banda. Tienen que ser del MISMO lugar y
    ojalá desde el mismo punto de vista: si no, el antes/después no convence.
    (La convención de nombres está en estrategia/05-guia-fotos.md.)
  · Cada banda muestra una franja horizontal de la foto. Si la parte importante
    queda cortada, ajustá `object-position` de esa <img>: "center 30%" sube el
    encuadre, "center 70%" lo baja.
  · Se puede convertir en dos bandas (solo antes/después): borrá una .banda y
    cambiá `grid-template-rows` a `1fr 1fr` en .tiras.

  EXPORTAR: desde anuncios/ correr  ./exportar.sh 05-muros-pintura
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>BJ Soluciones — Anuncio 05 · Muros antes/durante/después (1080×1350)</title>
  <link rel="stylesheet" href="../_marca/marca.css">
  <style>
    :root { --w: 1080px; --h: 1350px; }   /* formato 4:5 */

    .lienzo { background: var(--negro); }

    /* ---- Cabecera ---- */
    .cabecera {
      position: absolute; top: 0; left: 0; right: 0; height: 170px; z-index: 4;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 56px;
    }
    .cabecera .rotulo {
      font-size: 21px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
      color: var(--rojo); text-align: right; line-height: 1.5;
    }
    .cabecera .rotulo b { color: #fff; display: block; font-weight: 700; }

    /* ---- Tres bandas de foto ---- */
    .tiras {
      position: absolute; top: 170px; left: 0; right: 0; height: 915px; z-index: 1;
      display: grid; grid-template-rows: 1fr 1fr 1fr; gap: 5px;
      background: var(--rojo);   /* se ve en las separaciones */
    }
    .banda { position: relative; overflow: hidden; }
    .banda .etiqueta { top: 22px; left: 24px; font-size: 26px; padding: 10px 22px; }

    /* ---- Pie ---- */
    .bloque-pie {
      position: absolute; left: 56px; right: 56px; bottom: 0; height: 265px; z-index: 4;
      display: flex; align-items: center; justify-content: space-between; gap: 30px;
    }
    .bloque-pie .texto-pie { flex: 1; min-width: 0; }
    .bloque-pie .titular { font-size: 42px; }
    .bloque-pie .bajada  { font-size: 22px; margin-top: 12px; }
  </style>
</head>
<body data-ancho="1080" data-alto="1350">

<div class="lienzo">

  <!-- ---------- CABECERA ---------- -->
  <div class="cabecera">
    <div class="marca chica">
      <img src="../../public/logo.png" alt="Logo BJ Soluciones">
      <div>
        <div class="nombre">BJ Soluciones</div>
        <div class="slogan">Construcción · Remodelación · Acabados</div>
      </div>
    </div>
    <div class="rotulo">
      El mismo muro
      <b>en tres momentos</b>
    </div>
  </div>

  <!-- ---------- BANDAS ---------- -->
  <div class="tiras">

    <div class="banda">
      <img class="foto" style="object-position: center 42%"
           src="../../public/proyectos/proyectoB-antes.jpg"
           alt="Muro exterior dañado antes de la reparación">
      <div class="etiqueta">Antes</div>
    </div>

    <div class="banda">
      <img class="foto" style="object-position: center 52%"
           src="../../public/proyectos/proyectoB-durante.jpg"
           alt="Muro resanado y sellado durante el trabajo">
      <div class="etiqueta">Durante</div>
    </div>

    <div class="banda">
      <img class="foto" style="object-position: center 52%"
           src="../../public/proyectos/proyectoB-despues.jpg"
           alt="Muro reparado y pintado">
      <div class="etiqueta despues">Después</div>
    </div>

  </div>

  <!-- ---------- PIE ---------- -->
  <div class="bloque-pie">
    <div class="texto-pie">
      <h1 class="titular">Muro dañado,<br>muro <span class="resalte">nuevo</span></h1>
      <p class="bajada">Resane, sellado y pintura que aguanta sol y lluvia.</p>
    </div>

    <div class="wa chica">
      <span class="icono">
        <svg viewBox="0 0 24 24"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.42-.08-.12-.28-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.89 9.89-9.89 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.89-9.88 9.89m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.41"/></svg>
      </span>
      <span class="texto">
        <span class="arriba">Cotice gratis</span>
        <span class="numero">6004-0817</span>
      </span>
    </div>
  </div>

</div>
</body>
</html>
