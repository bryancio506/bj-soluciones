<!doctype html>
<!--
  PORTADA DE FACEBOOK — BJ Soluciones
  ===========================================================================
  Formato : 1640 x 624  →  foto de portada de la Página de Facebook
  Número  : solo el principal (6004-0817). Esta pieza queda FUERA del juego
            del socio a propósito — la página es una sola y su botón de
            WhatsApp apunta al número principal (ver docs/facebook/README.md).
            Por eso lleva `data-solo-principal="1"` en el <body>.

  LA ZONA SEGURA ES LO MÁS IMPORTANTE ACÁ
  ---------------------------------------
  Facebook muestra la portada de dos formas distintas:
    · en computadora  → ~820 x 312 (se ve casi toda)
    · en celular      → ~640 x 360 (RECORTA LOS LADOS)
  Traducido a este lienzo de 1640 px: en celular solo se ve la franja central
  de ~1109 px, o sea de x=265 a x=1374. Todo lo que importa (logo, nombre,
  número) tiene que quedar adentro de ahí o desaparece en el celular, que es
  donde lo va a ver casi todo el mundo.

  Además, la foto de perfil de la página se monta encima de la esquina
  inferior izquierda de la portada, así que esa zona se deja vacía.

  Para ver las guías: agregá la clase `ver-guias` al <body> y recargá.
  Aparecen dos marcos punteados (zona segura de celular y zona de la foto de
  perfil). Quitala antes de exportar.

  QUÉ SE PUEDE CAMBIAR
  --------------------
  · La foto de fondo → el `src` de <img class="foto">. Que sea horizontal y
    que la parte interesante no quede en el centro, porque ahí va el texto.
  · Los servicios de la tira → los <span> dentro de .servicios.

  EXPORTAR: desde anuncios/ correr  ./exportar.sh portada-facebook
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>BJ Soluciones — Portada de Facebook (1640×624)</title>
  <link rel="stylesheet" href="../_marca/marca.css">
  <style>
    :root { --w: 1640px; --h: 624px; }

    /* Bloque central: todo vive acá adentro, dentro de la zona segura. */
    .centro {
      position: absolute; inset: 0; z-index: 4;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px;
      /* Laterales: respetan el recorte del celular.
         Abajo: deja libre la franja donde Facebook monta la foto de perfil. */
      padding: 0 300px 110px;
      text-align: center;
    }

    .centro .marca img { width: 96px; height: 96px; border-radius: 20px; }
    .centro .marca .nombre { font-size: 60px; }
    .centro .marca .slogan { font-size: 21px; margin-top: 9px; }

    .servicios { padding: 14px 10px; }
    .servicios span { font-size: 20px; padding: 0 24px; }

    .linea-contacto {
      display: flex; align-items: center; gap: 26px;
    }
    .sitio {
      font-family: var(--head); font-weight: 800; font-size: 26px;
      letter-spacing: -.01em; white-space: nowrap;
      text-shadow: 0 2px 12px rgba(0,0,0,.6);
    }

    /* Cuña roja decorativa: va en las orillas a propósito, donde el celular
       recorta. Si desaparece no se pierde información. */
    .cunia-der { top: -180px; right: -170px; width: 420px; height: 900px; transform: rotate(22deg); opacity: .9; }
    .cunia-izq { top: -180px; left: -230px;  width: 300px; height: 900px; transform: rotate(22deg); opacity: .55; }

    /* --- Guías (solo con class="ver-guias" en el body) --- */
    .guia { display: none; position: absolute; z-index: 99; pointer-events: none; }
    body.ver-guias .guia { display: block; }
    .guia-celular { inset: 0 265px; border: 3px dashed rgba(0,255,180,.9); }
    .guia-perfil  { left: 40px; bottom: 0; width: 360px; height: 200px; border: 3px dashed rgba(255,60,60,.9); }
  </style>
</head>
<body data-ancho="1640" data-alto="624" data-solo-principal="1">

<div class="lienzo">

  <!-- ---------- FOTO DE FONDO ---------- -->
  <div class="capa-foto">
    <img class="foto" style="object-position: center 58%"
         src="../../public/proyectos/soldadura-03-despues.jpeg"
         alt="Ampliación con estructura metálica terminada">
  </div>
  <div class="velo-todo" style="background: rgba(10,10,10,.62)"></div>

  <!-- ---------- CUÑAS ROJAS (decorativas, en las orillas) ---------- -->
  <div class="cunia-roja cunia-der"></div>
  <div class="cunia-roja cunia-izq"></div>

  <!-- ---------- CONTENIDO ---------- -->
  <div class="centro">

    <div class="marca">
      <img src="../../public/logo.png" alt="Logo BJ Soluciones">
      <div>
        <div class="nombre">BJ Soluciones</div>
        <div class="slogan">Contratistas de construcción · Costa Rica</div>
      </div>
    </div>

    <div class="servicios">
      <span>Soldadura</span>
      <span>Pintura</span>
      <span>Construcción</span>
      <span>Remodelación</span>
    </div>

    <div class="linea-contacto">
      <div class="wa chica">
        <span class="icono">
          <svg viewBox="0 0 24 24"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.42-.08-.12-.28-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.89 9.89-9.89 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.89-9.88 9.89m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.41"/></svg>
        </span>
        <span class="texto">
          <span class="arriba">Cotización gratis</span>
          <span class="numero">6004-0817</span>
        </span>
      </div>

      <div class="sitio">bj-soluciones.netlify.app</div>
    </div>

  </div>

  <!-- Guías de zona segura (solo con class="ver-guias" en el body) -->
  <div class="guia guia-celular"></div>
  <div class="guia guia-perfil"></div>

</div>
</body>
</html>
